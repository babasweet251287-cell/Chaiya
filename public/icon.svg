<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="50%" stop-color="#060709"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a6508"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff4d0" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Inner Safe Zone Guide Circle (for maskable compliance) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Architectural Horizon Arc -->
  <path d="M 96 380 Q 256 340 416 380" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="180" r="90" fill="url(#goldLight)" opacity="0.15"/>

  <!-- Spires / Towers Group -->
  <g filter="url(#glow)">
    <!-- Left Wing Tower -->
    <path d="M 168 370 L 168 240 L 208 200 L 208 370 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M 208 200 L 216 210 L 216 370 L 208 370 Z" fill="#8a6508" opacity="0.9"/>

    <!-- Right Wing Tower -->
    <path d="M 304 200 L 344 240 L 344 370 L 304 370 Z" fill="url(#goldGrad)" opacity="0.75"/>
    <path d="M 296 210 L 304 200 L 304 370 L 296 370 Z" fill="#fff4d0" opacity="0.9"/>

    <!-- Central Apex Pinnacle (Nirmal Chhaya Towers) -->
    <path d="M 248 100 L 264 100 L 276 370 L 236 370 Z" fill="url(#goldGrad)"/>
    <path d="M 256 80 L 256 100" stroke="#fff4d0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Central Tower Facet highlight -->
    <path d="M 256 100 L 264 100 L 276 370 L 256 370 Z" fill="#aa820a" opacity="0.4"/>
  </g>

  <!-- Geometric Crown Accents -->
  <polygon points="256,70 260,82 256,94 252,82" fill="#fff4d0"/>

  <!-- Horizontal Architectural Floor Louvers -->
  <line x1="176" y1="260" x2="200" y2="260" stroke="#0e1017" stroke-width="2"/>
  <line x1="176" y1="280" x2="200" y2="280" stroke="#0e1017" stroke-width="2"/>
  <line x1="176" y1="300" x2="200" y2="300" stroke="#0e1017" stroke-width="2"/>
  <line x1="176" y1="320" x2="200" y2="320" stroke="#0e1017" stroke-width="2"/>
  <line x1="176" y1="340" x2="200" y2="340" stroke="#0e1017" stroke-width="2"/>

  <line x1="312" y1="260" x2="336" y2="260" stroke="#0e1017" stroke-width="2"/>
  <line x1="312" y1="280" x2="336" y2="280" stroke="#0e1017" stroke-width="2"/>
  <line x1="312" y1="300" x2="336" y2="300" stroke="#0e1017" stroke-width="2"/>
  <line x1="312" y1="320" x2="336" y2="320" stroke="#0e1017" stroke-width="2"/>
  <line x1="312" y1="340" x2="336" y2="340" stroke="#0e1017" stroke-width="2"/>

  <!-- Monogram & Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="600" fill="url(#goldGrad)" letter-spacing="6">NIRMAL CHHAYA</text>
  <text x="256" y="444" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="400" fill="#c7bfb5" letter-spacing="8">TOWERS • CHANDIGARH</text>
</svg>
